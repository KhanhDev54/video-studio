name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "0"  # giữ mặc định code page của Windows để bắt lỗi encoding
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài FFmpeg (Windows)
        if: runner.os == 'Windows'
        # choco có thể báo thành công khi feed lỗi (503) mà không cài gì, nên kiểm tra lại
        # và dự phòng bằng bản build tĩnh trên GitHub Releases.
        run: |
          for ($i = 1; $i -le 3; $i++) {
            choco install ffmpeg -y --no-progress
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { exit 0 }
            Start-Sleep -Seconds (10 * $i)
          }
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $bin = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          Add-Content $env:GITHUB_PATH $bin
      - name: Cài FFmpeg và thư viện Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: python -m pip install -r requirements-dev.txt
      - name: Tải Rhubarb Lip Sync (MIT) cho test khớp miệng
        shell: bash
        run: |
          os=$([ "$RUNNER_OS" = "Windows" ] && echo Windows || echo Linux)
          curl -sSL -o rhubarb.zip "https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.14.0/Rhubarb-Lip-Sync-1.14.0-$os.zip"
          mkdir -p "$RUNNER_TEMP/rhubarb" && unzip -q rhubarb.zip -d "$RUNNER_TEMP/rhubarb"
          echo "VSTUDIO_RHUBARB=$RUNNER_TEMP/rhubarb" >> "$GITHUB_ENV"
      - run: ffmpeg -version
      - name: Test
        run: python -m pytest -v -rs
      - name: Test Edge TTS thật (cần mạng tới dịch vụ Microsoft)
        env:
          VSTUDIO_TEST_TTS: "1"
        run: python -m pytest -v -rs -k "tts or voice or rhubarb"

  windows-exe:
    # Đóng gói .exe (PyInstaller), chạy tự kiểm tra trên chính bản đóng gói rồi tải lên Artifacts.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Đóng gói
        run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1
      - name: Tải FFmpeg cho bước tự kiểm tra (không đóng gói kèm)
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $bin = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          "VSTUDIO_FFMPEG_DIR=$bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Tự kiểm tra bản .exe (dựng thử một cảnh có giọng Edge TTS)
        run: |
          $p = Start-Process dist\VideoStudio\VideoStudio.exe -ArgumentList "--selftest", "$env:RUNNER_TEMP\selftest.json", "tts" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\selftest.json"
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: VideoStudio-windows
          path: dist/VideoStudio
          retention-days: 30
