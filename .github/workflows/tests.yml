name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "0"  # giữ mặc định code page của Windows để bắt lỗi encoding
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Cài FFmpeg và thư viện Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: python -m pip install -r requirements-dev.txt
      - run: ffmpeg -version
      - name: Test
        run: python -m pytest -v -rs
      - name: Test Edge TTS thật (cần mạng tới dịch vụ Microsoft)
        env:
          VSTUDIO_TEST_TTS: "1"
        run: python -m pytest -v -k "tts or voice"
